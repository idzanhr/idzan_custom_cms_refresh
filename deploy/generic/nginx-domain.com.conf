# nginx for domain.com — static public site behind Varnish, PageSpeed optimizing, hidden PHP admin.
#
#   browser ─► nginx :443 (TLS) ─┬─► /studio-CHANGE-ME/  → PHP-FPM (admin, never cached)
#                                └─► everything else     → Varnish :6081 → nginx 127.0.0.1:8080 (files + PageSpeed)
#
#   /var/www/domain.com/          the CMS (config.php, admin/, inc/, tools/) — not served
#   /var/www/domain.com/public/   generated HTML, assets, uploads
#
# Replace: studio-CHANGE-ME (= admin_path in config.php), the PHP-FPM socket, certificate paths.

# ---------------------------------------------------------------- redirects
server {
    listen 80;
    listen [::]:80;
    server_name domain.com www.domain.com;
    return 301 https://domain.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.domain.com;
    ssl_certificate     /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;
    return 301 https://domain.com$request_uri;
}

# ---------------------------------------------------------------- public entry (TLS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name domain.com;

    ssl_certificate     /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;

    access_log /var/log/nginx/domain.com.access.log;
    error_log  /var/log/nginx/domain.com.error.log;

    # The site's own 404 page, also for blocked addresses (no bare nginx error pages).
    root /var/www/domain.com/public;
    error_page 404 /404.html;
    error_page 403 =404 /404.html;
    location = /404.html { internal; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "browsing-topics=(), camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    # The sha256 value allows the CMS's inline light/dark script; Admin → Publish & export shows it if it ever changes.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; style-src 'self'; script-src 'self' 'sha256-VgbM2Uszhvr8jCJ7vdoGKEXSNNGPHv0O3MLi8IwsFjQ='; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Public site → Varnish
    location / {
        proxy_pass http://127.0.0.1:6081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Hidden admin → PHP directly (bypasses Varnish and PageSpeed)
    location = /studio-CHANGE-ME { return 301 /studio-CHANGE-ME/; }
    location ^~ /studio-CHANGE-ME/ {
        alias /var/www/domain.com/admin/;
        index index.php;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # this location drops the server-level headers
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        client_max_body_size 20m;
        # Optional: only your IPs
        # allow 203.0.113.10;
        # deny all;
        location ~ \.php$ {
            if (!-f $request_filename) { return 404; }
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
            fastcgi_param HTTPS on;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            fastcgi_read_timeout 300;
        }
        location ~ /\. { deny all; }
    }
    # Admin pages load their CSS/JS from the public folder — serve those directly too.
    location ^~ /assets/admin/ { root /var/www/domain.com/public; expires 7d; }

    location ^~ /admin/ { return 404; }
}

# ---------------------------------------------------------------- backend for Varnish (local only)
server {
    listen 127.0.0.1:8080;
    server_name domain.com;

    root  /var/www/domain.com/public;
    index index.html;
    charset utf-8;
    access_log off;
    absolute_redirect off;

    # Google PageSpeed (ngx_pagespeed). Only safe filters: nothing that injects inline scripts,
    # so the strict Content-Security-Policy keeps working.
    pagespeed on;
    pagespeed FileCachePath /var/cache/ngx_pagespeed;
    pagespeed RewriteLevel PassThrough;
    pagespeed HonorCsp on;
    pagespeed EnableFilters collapse_whitespace,remove_comments,rewrite_css,rewrite_javascript,extend_cache,rewrite_images,recompress_images,convert_jpeg_to_webp,convert_png_to_jpeg,strip_image_meta_data;
    pagespeed DisableFilters lazyload_images,defer_javascript,inline_javascript,inline_css,prioritize_critical_css,add_instrumentation;
    pagespeed Domain https://domain.com;
    pagespeed RespectXForwardedProto on;
    pagespeed DownstreamCachePurgeLocationPrefix http://127.0.0.1:6081;
    pagespeed DownstreamCachePurgeMethod PURGE;
    pagespeed DownstreamCacheRewrittenPercentageThreshold 95;
    location ~ "\.pagespeed\.([a-z]\.)?[a-z]{2}\.[^.]{10}\.[^.]+" { add_header "" ""; }
    location ~ "^/pagespeed_static/" { }
    location ~ "^/ngx_pagespeed_beacon$" { }

    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    error_page 403 =404 /404.html;

    location ^~ /uploads/ {
        expires 365d;
        location ~* \.(?:php\d?|phtml|phar|html?|svg|js)$ { deny all; }
    }
    location ~* \.(?:css|js)$ { expires 7d; }
    location ~* \.avif$ { types { } default_type image/avif; expires 30d; }   # older nginx doesn't know AVIF
    location ~ /\. { deny all; }
}
