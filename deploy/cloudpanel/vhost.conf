# CloudPanel Vhost for domain.com — paste into: Sites → domain.com → Vhost → Save.
# Before pasting, replace (Ctrl+H in a text editor):
#   SITEUSER          → your site user in CloudPanel (the folder name in /home/)
#   studio-CHANGE-ME  → your secret admin path (same as 'admin_path' in config.php, without slashes)
#   CACHE-TAG-PREFIX  → Varnish Cache → "Cache Tag Prefix" of this site in CloudPanel
# The {{…}} placeholders stay exactly as they are — CloudPanel fills them in.

# ---- Bot blocking (works even for bots that ignore robots.txt) ----
# Matches anywhere in the User-Agent, case-insensitive. Blocked bots get no answer at all (444).
# Keep this list in step with Settings → Search & bots → robots.txt in the CMS.
# Only bots that ignore robots.txt or copy whole sites are listed; everything else is handled by robots.txt.
# Never list: Googlebot, bingbot, Applebot, DuckDuckBot/DuckAssistBot, ClaudeBot/Claude-*, GPTBot/OAI-SearchBot/ChatGPT-User, PerplexityBot/Perplexity-User,
# and link previews (facebookexternalhit, Twitterbot, LinkedInBot, Mastodon, WhatsApp, TelegramBot, Slackbot, Discordbot).
map $http_user_agent $idzan_blocked_bot {
  default 0;
  "" 1;   # no User-Agent at all: scripts and scanners
  "~*(bytespider|tiktokspider|ccbot|meta-externalagent|meta-externalfetcher|facebookbot|amazonbot|cohere-ai|cohere-training|diffbot|imagesiftbot|omgili|timpibot|youbot|ai2bot|pangubot|petalbot|ahrefsbot|semrushbot|mj12bot|dotbot|dataforseobot|blexbot)" 1;
}

# Consolidated Redirects: All old/alias roads lead to domain.com
server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  {{ssl_certificate_key}}
  {{ssl_certificate}}

  # Catch both the old domain and the www version of the new one
  server_name domain.eu www.domain.eu www.domain.com;

  return 301 https://domain.com$request_uri;
}

# --- Main site (domain.com) ---
server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name domain.com www1.domain.com;

  # Public HTML generated by the CMS (not the WordPress folder).
  root /home/SITEUSER/htdocs/domain.com/public;
  index index.html;

  # The site's own 404 page for anything that doesn't exist, also for blocked addresses
  # (old WordPress paths, hidden files), so nothing shows nginx's bare error pages.
  error_page 404 /404.html;
  error_page 403 =404 /404.html;
  location = /404.html {
    internal;   # no add_header here: it would drop the security headers above
  }

  {{nginx_access_log}}
  {{nginx_error_log}}

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  server_tokens off;   # don't show the nginx version in headers or error pages

  # Security headers (no trackers, no third-party scripts).
  # NOTE (nginx rule): a location that has its own add_header loses ALL of these,
  # so the locations further down that add headers repeat the ones they need.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "browsing-topics=(), camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  # The sha256 value allows the CMS's inline light/dark script; Admin → Publish & export shows it if it ever changes.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; style-src 'self'; script-src 'self' 'sha256-VgbM2Uszhvr8jCJ7vdoGKEXSNNGPHv0O3MLi8IwsFjQ='; font-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  location ~ /\. {
    deny all;
  }

  # Old WordPress addresses and things scanners look for: none of them exist here.
  location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-includes|phpmyadmin|pma|myadmin|cgi-bin|vendor|server-status) {
    return 404;
  }
  # Backups, dumps, logs and config files are never published (uploads have their own rules below).
  location ~* \.(sql|bak|old|orig|save|swp|log|ini|conf|env|sh|tar|gz|tgz|7z|rar)$ {
    return 404;
  }
  # robots.txt, llms.txt and security.txt stay readable for every bot, blocked or not.
  location ~ ^/(robots|llms)\.txt$ {
    try_files $uri =404;
  }
  location ^~ /admin/ {
    return 404;
  }

  # ---- Hidden CMS admin: straight to PHP, never through Varnish ----
  location = /studio-CHANGE-ME {
    return 301 /studio-CHANGE-ME/;
  }
  location ^~ /studio-CHANGE-ME/ {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $host;
    proxy_pass http://127.0.0.1:8080;
    proxy_hide_header X-Powered-By;
    # The admin's PHP sends its own CSP, X-Frame-Options, nosniff, Referrer-Policy and no-store;
    # nginx adds the rest here (this location replaces the server-level headers).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "browsing-topics=(), camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      7200;
    proxy_send_timeout         7200;
    proxy_read_timeout         7200;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
    client_max_body_size 50m;
  }

  # ---- Public pages through Varnish ----
  location / {
    if ($idzan_blocked_bot) { return 444; }   # close the connection: nothing for BunnyCDN to cache
    {{varnish_proxy_pass}}
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header X-Varnish;
    proxy_hide_header X-Cache-Tags;       # internal Varnish purge tag, visitors don't need it
    proxy_hide_header X-Cache-Lifetime;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Via;                # "1.1 varnish (Varnish/7.x)": no software versions for visitors
    proxy_redirect off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout      720;
    proxy_send_timeout         720;
    proxy_read_timeout         720;
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;
    proxy_temp_file_write_size 256k;
  }

  # Uploaded images: long cache, and nothing executable or scriptable is ever served from here.
  location ^~ /uploads/ {
    if ($idzan_blocked_bot) { return 444; }   # close the connection: nothing for BunnyCDN to cache
    expires max;
    access_log off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    location ~* \.(php\d?|phtml|phar|html?|svg|js)$ {
      deny all;
    }
    location ~* \.avif$ {
      types { } default_type image/avif;   # older nginx doesn't know AVIF yet
    }
  }

  # AVIF copies made by the CMS (/_img/…): older nginx versions don't know the type, so it is set here.
  location ~* \.avif$ {
    if ($idzan_blocked_bot) { return 444; }   # close the connection: nothing for BunnyCDN to cache
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    types { } default_type image/avif;
    expires max;
    access_log off;
  }

  # CSS, JS, fonts, images: served directly by nginx.
  location ~* ^.+\.(css|js|jpg|jpeg|gif|png|ico|svg|ttf|otf|woff|woff2|eot|webp|avif|map)$ {
    if ($idzan_blocked_bot) { return 444; }   # close the connection: nothing for BunnyCDN to cache
    add_header alt-svc 'h3=":443"; ma=86400';
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    expires max;
    access_log off;
  }
}

# --- Backend for Varnish and the admin (local only) ---
server {
  listen 8080;
  listen [::]:8080;
  server_name domain.com www1.domain.com;
  root /home/SITEUSER/htdocs/domain.com/public;
  index index.html;

  include /etc/nginx/global_settings;
  absolute_redirect off;   # /about-me → /about-me/ without leaking :8080 to visitors

  # Lets CloudPanel's Varnish cache the pages and clear them on publish (Cache Tag Prefix of this site).
  add_header X-Cache-Tags "CACHE-TAG-PREFIX";
  add_header X-Cache-Lifetime "604800";
  add_header Cache-Control "public, max-age=0, s-maxage=604800";

  # Static site: plain files only.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;
  error_page 403 =404 /404.html;

  # Hidden CMS admin (the only place PHP runs).
  location ^~ /studio-CHANGE-ME/ {
    alias /home/SITEUSER/htdocs/domain.com/admin/;
    index index.php;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location ~ \.php$ {
      if (!-f $request_filename) { return 404; }
      include fastcgi_params;
      fastcgi_intercept_errors on;
      fastcgi_param SCRIPT_FILENAME $request_filename;
      fastcgi_param SCRIPT_NAME $fastcgi_script_name;
      fastcgi_read_timeout 3600;
      fastcgi_send_timeout 3600;
      fastcgi_param HTTPS "on";
      fastcgi_param SERVER_PORT 443;
      fastcgi_pass 127.0.0.1:{{php_fpm_port}};
      fastcgi_param PHP_VALUE "{{php_settings}}";
    }
  }

  # No other PHP anywhere.
  location ~ \.php$ {
    return 404;
  }
  location ~ /\. {
    deny all;
  }
}
